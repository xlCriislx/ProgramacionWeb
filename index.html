<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Divisas</title>

    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Conversor de Divisas</h1>
        </header>

        <main>
            <section id="conversion">
                <h2>Convierte tus Monedas</h2>
                <form id="conversion-form">
                    <label for="amount">Cantidad:</label>
                    <input type="number" id="amount" placeholder="Ingresa la cantidad" required>

                    <label for="from-currency">De:</label>
                    <select id="from-currency" required></select>

                    <label for="to-currency">A:</label>
                    <select id="to-currency" required></select>

                    <button type="submit">Convertir</button>
                </form>
                
                <div id="result" style="display: none;">
                    <p>El resultado es: <span id="converted-amount"></span></p>
                </div>
            </section>

        </main>

        <footer>
            <p>© 2025 Conversor de Divisas. Todos los derechos reservados.</p>
        </footer>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
